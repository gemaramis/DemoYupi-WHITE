<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <title>Yupi AR Goalie – Penalty Shootout</title>
  <meta name="description" content="Yupi AR Penalty Shootout. Scan. Play. Win! GUMMY FUN, GOAL WON!"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ===== SPLASH / LOADING ===== -->
<div id="splash">
  <div class="splash-bg"></div>
  <div class="splash-content">
    <div class="splash-logo">
      <span class="logo-y">Y</span><span class="logo-u">u</span><span class="logo-p">p</span><span class="logo-i">i</span>
    </div>
    <div class="splash-tagline">GUMMY FUN, GOAL WON!</div>
    <div class="splash-ball">⚽</div>
    <div class="splash-bar-wrap"><div class="splash-bar" id="splash-bar"></div></div>
    <div class="splash-hint" id="splash-hint">Loading game…</div>
  </div>
</div>

<!-- ===== START SCREEN ===== -->
<div id="start-screen" class="screen-hidden">
  <div class="start-bg"></div>
  <div class="start-card">
    <div class="start-logo-wrap">
      <span class="logo-y">Y</span><span class="logo-u">u</span><span class="logo-p">p</span><span class="logo-i">i</span>
    </div>
    <div class="start-subtitle">WORLD CUP AR</div>
    <img src="assets/ball.png" class="start-ball-img" alt="Yupi Soccer Ball"/>
    <p class="start-desc">Point your camera at the <strong>floor</strong><br/>and kick for glory!</p>
    <button id="btn-start" class="yupi-btn yupi-btn-green">
      <span>⚽ TAP TO PLAY</span>
    </button>
    <p class="start-note">📷 Camera permission required</p>
  </div>
</div>

<!-- ===== SCORE HUD ===== -->
<div id="hud" class="screen-hidden">

  <!-- Top score bar -->
  <div class="hud-scorebar">
    <div class="hud-team hud-team-left">
      <span class="hud-team-name">YUPI</span>
      <span class="hud-team-score" id="score-you">0</span>
    </div>
    <div class="hud-center-label">VS</div>
    <div class="hud-team hud-team-right">
      <span class="hud-team-score" id="score-candy">0</span>
      <span class="hud-team-name">CANDY</span>
    </div>
  </div>

  <!-- Mode label -->
  <div class="hud-goalie-label">GOALIE</div>

  <!-- Shots remaining -->
  <div class="hud-shots-row">
    <div class="hud-shots-label">SHOTS LEFT</div>
    <div class="hud-shots-pips" id="shots-pips"></div>
  </div>

  <!-- Bottom controls -->
  <div class="hud-controls">
    <button id="btn-left"  class="ctrl-btn ctrl-arrow" aria-label="Aim Left">◀</button>
    <button id="btn-shoot" class="ctrl-btn ctrl-shoot" aria-label="Shoot">
      <div class="shoot-icon">👟</div>
      <div class="shoot-label">SHOOT</div>
    </button>
    <button id="btn-right" class="ctrl-btn ctrl-arrow" aria-label="Aim Right">▶</button>
  </div>

  <!-- Bottom Yupi branding -->
  <div class="hud-footer">
    <span class="logo-y">Y</span><span class="logo-u">u</span><span class="logo-p">p</span><span class="logo-i">i</span>
    <span class="hud-footer-tag">GUMMY FUN, GOAL WON!</span>
  </div>

</div>

<!-- ===== FEEDBACK OVERLAY ===== -->
<div id="feedback" class="feedback screen-hidden">
  <div class="feedback-inner" id="feedback-inner">
    <div class="feedback-emoji" id="feedback-emoji"></div>
    <div class="feedback-text" id="feedback-text"></div>
  </div>
</div>

<!-- ===== GAME OVER ===== -->
<div id="gameover" class="screen-hidden">
  <div class="go-card">
    <div class="go-logo">
      <span class="logo-y">Y</span><span class="logo-u">u</span><span class="logo-p">p</span><span class="logo-i">i</span>
    </div>
    <div class="go-title" id="go-title">FULL TIME!</div>
    <div class="go-scoreboard">
      <div class="go-score-block">
        <div class="go-score-num" id="go-goals">0</div>
        <div class="go-score-lbl">GOALS</div>
      </div>
      <div class="go-divider">/</div>
      <div class="go-score-block">
        <div class="go-score-num" id="go-total">5</div>
        <div class="go-score-lbl">SHOTS</div>
      </div>
    </div>
    <div class="go-rating" id="go-rating"></div>
    <button id="btn-restart" class="yupi-btn yupi-btn-red">🔄 PLAY AGAIN</button>
    <div class="go-share-row">
      <button class="yupi-btn yupi-btn-blue go-share-btn" id="btn-leaderboard">🏆 LEADERBOARD</button>
    </div>
    <p class="go-note">Top 500 players WIN Rp 5.000 weekly!</p>
  </div>
</div>

<!-- ===== AR CANVAS ===== -->
<div id="ar-container"></div>

<!-- ===== AIM INDICATOR ===== -->
<div id="aim-indicator" class="screen-hidden">
  <div class="aim-dot"></div>
  <div class="aim-ring"></div>
</div>

<script src="game.js"></script>
</body>
</html>
